[package]
name = "folio"
version = "0.4.1"
edition = "2024"

[dependencies]
cairo = { version = "0.22", package = "cairo-rs", features = ["png"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
pango = { version = "0.22", features = ["v1_50"] }
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
